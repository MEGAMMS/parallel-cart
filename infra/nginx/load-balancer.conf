upstream parallel_cart_backend {
    # Round-robin is the default upstream strategy in Nginx.
    server app-1:8080;
    server app-2:8080;
}

log_format upstream_trace '$remote_addr - $request status=$status '
                          'upstream=$upstream_addr upstream_status=$upstream_status '
                          'upstream_instance=$upstream_http_x_app_instance '
                          'rt=$request_time urt=$upstream_response_time';

server {
    listen 8080;

    access_log /var/log/nginx/access.log upstream_trace;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://parallel_cart_backend;
    }
}
