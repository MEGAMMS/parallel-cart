spring:
  application:
    name: parallel-cart
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,kafka
        liveness:
          include: livenessState,ping
  health:
    redis:
      enabled: true
    db:
      enabled: true
    kafka:
      enabled: true
