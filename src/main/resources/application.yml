spring:
  application:
    name: parallel-cart
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,bottlenecks,benchmarkreport
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,kafka
        liveness:
          include: livenessState,ping
  health:
    redis:
      enabled: true
    db:
      enabled: true
    kafka:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    web:
      server:
        request:
          autotime:
            enabled: true
    distribution:
      slo:
        http: 50ms,100ms,200ms,500ms,1s,2s,5s
logging:
  level:
    com.parallelcart.observability: DEBUG

app:
  cache:
    product:
      ttl-seconds: 60
    carts:
      ttl: 15m
    orders:
      ttl: 30m
  distributed-lock:
    inventory:
      wait-time: 2s
      lease-time: 10s
    idempotency:
      wait-time: 0s
      lease-time: 15s
