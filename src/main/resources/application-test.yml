spring:
  datasource:
    url: jdbc:h2:mem:parallelcart_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
management:
  endpoint:
    health:
      validate-group-membership: false

app:
  kafka:
    topics:
      order-created: order.created
