services:
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parallel-cart-app-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parallel_cart
      SPRING_DATASOURCE_USERNAME: parallel_cart
      SPRING_DATASOURCE_PASSWORD: parallel_cart
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: local
      APP_INSTANCE_ID: app-1

  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parallel-cart-app-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parallel_cart
      SPRING_DATASOURCE_USERNAME: parallel_cart
      SPRING_DATASOURCE_PASSWORD: parallel_cart
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: local
      APP_INSTANCE_ID: app-2
      APP_SEED_ENABLED: "false"

  nginx:
    image: nginx:1.27-alpine
    container_name: parallel-cart-nginx
    depends_on:
      app-1:
        condition: service_started
      app-2:
        condition: service_started
    ports:
      - "8081:8080"
    volumes:
      - ./infra/nginx/load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
