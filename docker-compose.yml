services:
  postgres:
    image: postgres:16-alpine
    container_name: parallel-cart-postgres
    environment:
      POSTGRES_DB: parallel_cart
      POSTGRES_USER: parallel_cart
      POSTGRES_PASSWORD: parallel_cart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallel_cart -d parallel_cart"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: parallel-cart-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: parallel-cart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: parallel-cart-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 20"]
      interval: 15s
      timeout: 10s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parallel-cart-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parallel_cart
      SPRING_DATASOURCE_USERNAME: parallel_cart
      SPRING_DATASOURCE_PASSWORD: parallel_cart
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: local
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE:-redis}
      APP_BACKPRESSURE_CHECKOUT_MAX_CONCURRENT: ${APP_BACKPRESSURE_CHECKOUT_MAX_CONCURRENT:-50}
    ports:
      - "8080:8080"

  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parallel-cart-app-1
    profiles: ["lb"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parallel_cart
      SPRING_DATASOURCE_USERNAME: parallel_cart
      SPRING_DATASOURCE_PASSWORD: parallel_cart
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: local
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE:-redis}
      APP_BACKPRESSURE_CHECKOUT_MAX_CONCURRENT: ${APP_BACKPRESSURE_CHECKOUT_MAX_CONCURRENT:-50}

  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parallel-cart-app-2
    profiles: ["lb"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parallel_cart
      SPRING_DATASOURCE_USERNAME: parallel_cart
      SPRING_DATASOURCE_PASSWORD: parallel_cart
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: local
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE:-redis}
      APP_BACKPRESSURE_CHECKOUT_MAX_CONCURRENT: ${APP_BACKPRESSURE_CHECKOUT_MAX_CONCURRENT:-50}

  nginx:
    image: nginx:1.27-alpine
    container_name: parallel-cart-nginx
    profiles: ["lb"]
    depends_on:
      app-1:
        condition: service_started
      app-2:
        condition: service_started
    ports:
      - "8088:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  redis_data:
  kafka_data:
